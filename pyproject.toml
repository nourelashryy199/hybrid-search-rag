
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-search-rag"
version = "0.1.0"
description = "Evidence-grounded hybrid search RAG over internal documents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pymupdf>=1.24,<2",
    "torch==2.5.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "transformers>=4.41,<5",
    "sentence-transformers>=3,<6",
    "rank-bm25>=0.2.2,<1",
    "pinecone>=6,<9",
    "qdrant-client>=1.20,<2",
    "cohere>=5,<6",
    "anthropic>=0.40,<2",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
